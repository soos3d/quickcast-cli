name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  api-tests:
    name: API tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package (web-test + dev extras)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[web-test,dev]"

      - name: Ruff (Phase 2 paths — correctness rules)
        run: |
          ruff check --select E,F,B --ignore B008 \
            src/spectrax/auth_gate.py \
            src/spectrax/credentials.py \
            src/spectrax/config.py \
            src/spectrax/secrets.py \
            src/spectrax/paths.py \
            src/spectrax/app.py \
            src/spectrax/api/deps.py \
            src/spectrax/routes/auth.py \
            src/spectrax/routes/files.py \
            src/spectrax/routes/recordings.py \
            src/spectrax/routes/video.py \
            tests/test_api_characterization.py \
            tests/test_auth.py \
            tests/test_config_security.py \
            tests/test_config_model.py \
            tests/test_secrets_store.py \
            tests/test_app_factory.py \
            tests/test_runtime.py \
            tests/test_package_layout.py \
            tests/conftest.py \
            src/spectrax/cli.py \
            src/spectrax/runtime.py \
            src/spectrax/mediamtx/process.py

      - name: Pytest (API / unit, no torch, no MediaMTX)
        run: |
          pytest \
            tests/test_api_characterization.py \
            tests/test_auth.py \
            tests/test_config_security.py \
            tests/test_config_model.py \
            tests/test_secrets_store.py \
            tests/test_app_factory.py \
            tests/test_runtime.py \
            tests/test_package_layout.py \
            -m "not slow and not requires_mediamtx"

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SpectraX Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background: #0f1419; color: #e7e9ea; min-height: 100vh; display: flex; align-items: center; }
        .card { background: #1a2332; border: 1px solid #2f3b4a; }
        .form-control { background: #0f1419; border-color: #2f3b4a; color: #e7e9ea; }
        .form-control:focus { background: #0f1419; color: #e7e9ea; border-color: #3b82f6; box-shadow: none; }
    </style>
</head>
<body>
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-4">
                <div class="card shadow p-4">
                    <h1 class="h4 mb-3 text-center">SpectraX</h1>
                    <p class="text-secondary small text-center mb-4">Sign in to the dashboard</p>
                    <div id="error" class="alert alert-danger d-none" role="alert"></div>
                    <form id="loginForm">
                        <div class="mb-3">
                            <label for="password" class="form-label">Admin password</label>
                            <input type="password" class="form-control" id="password" required autocomplete="current-password">
                        </div>
                        <button type="submit" class="btn btn-primary w-100">Sign in</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
    <script>
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const errorEl = document.getElementById('error');
            errorEl.classList.add('d-none');
            const password = document.getElementById('password').value;
            try {
                const response = await fetch('/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    credentials: 'include',
                    body: JSON.stringify({ password }),
                });
                if (!response.ok) {
                    const data = await response.json().catch(() => ({}));
                    throw new Error(data.detail || 'Login failed');
                }
                window.location.href = '/';
            } catch (err) {
                errorEl.textContent = err.message || 'Login failed';
                errorEl.classList.remove('d-none');
            }
        });
    </script>
</body>
</html>

# Ruff configuration for SpectraX.
# Run from the repo root: `ruff check .` and `ruff format .`

target-version = "py38"
line-length = 100
extend-exclude = ["venv", ".venv", "video-feed/models"]

[lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "W",   # pycodestyle warnings
    "I",   # isort (import ordering)
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
]
ignore = [
    "E501",  # line length is enforced by the formatter, not the linter
    "B008",  # FastAPI/Typer rely on function calls in argument defaults
]

[lint.per-file-ignores]
"video-feed/tests/*" = ["F401", "F811"]  # pytest fixtures look like unused/shadowed imports

[format]
quote-style = "double"
indent-style = "space"
